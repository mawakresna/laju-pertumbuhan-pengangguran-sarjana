.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
  #mulatuli-growth-viz {
    --mulatuli-yellow: #fcd779;
    --mulatuli-amber: #9c6500;
    --mulatuli-text: #000000;
    width: 100%;
    box-sizing: border-box;
    padding: 1rem;
    color: var(--mulatuli-text);
    background: var(--mulatuli-yellow);
  }
  #mulatuli-growth-viz .growth-chart {
    position: relative;
    width: 100%;
    background: color-mix(in srgb, var(--card) 96%, var(--mulatuli-yellow) 4%);
  }
  #mulatuli-growth-viz .growth-heading { text-align: center; margin-bottom: 1rem; }
  #mulatuli-growth-viz .growth-heading h1 {
    margin: 0;
    color: var(--mulatuli-text);
    font-family: Georgia, &quot;Times New Roman&quot;, serif;
    font-size: clamp(1.75rem, 5.4vw, 3rem);
    font-weight: 500;
    line-height: 1.08;
  }
  #mulatuli-growth-viz .growth-heading p {
    margin: 0.45rem 0 0;
    color: var(--mulatuli-text);
    font-size: clamp(0.95rem, 2.7vw, 1.3rem);
  }
  #mulatuli-growth-viz svg { display: block; width: 100%; height: auto; overflow: visible; }
  #mulatuli-growth-viz .plot-bg {
    fill: color-mix(in srgb, var(--card) 96%, var(--mulatuli-yellow) 4%);
  }
  #mulatuli-growth-viz .grid,
  #mulatuli-growth-viz .axis,
  #mulatuli-growth-viz .gap-bracket {
    stroke: var(--border);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }
  #mulatuli-growth-viz .zero-line {
    stroke: var(--muted-foreground);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }
  #mulatuli-growth-viz .growth-line {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  #mulatuli-growth-viz .national-line,
  #mulatuli-growth-viz .national-dot { stroke: var(--mulatuli-amber); }
  #mulatuli-growth-viz .graduate-line,
  #mulatuli-growth-viz .graduate-dot { stroke: var(--foreground); }
  #mulatuli-growth-viz .national-dot {
    fill: var(--card);
    stroke-width: 2.5;
  }

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById('mulatuli-growth-viz');
  const svg = root.querySelector('svg');
  const tooltip = root.querySelector('.tooltip');
  const detail = root.querySelector('#growth-year-detail');
  const tableWrap = root.querySelector('.growth-data-table');
  const NS = 'http://www.w3.org/2000/svg';
  const data = [
    [2016, 7024172, 695304], [2017, 7005262, 606939],
    [2018, 6871264, 789113], [2019, 6816840, 839019],
    [2020, 6882200, 815407], [2021, 8746008, 999543],
    [2022, 8402153, 884769], [2023, 7989275, 753732],
    [2024, 7194862, 871860], [2025, 7278307, 1010652],
    [2026, 7243605, 1033737]
  ].map(([year, national, graduate]) =&gt; ({ year, national, graduate }));

  const baseN = data[0].national;
  const baseG = data[0].graduate;
  data.forEach((d, i) =&gt; {
    d.n = (d.national / baseN - 1) * 100;
    d.g = (d.graduate / baseG - 1) * 100;
    d.nYoy = i ? (d.national / data[i - 1].national - 1) * 100 : null;
    d.gYoy = i ? (d.graduate / data[i - 1].graduate - 1) * 100 : null;
  });

  const nf = new Intl.NumberFormat('id-ID');
  const pf = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1, signDisplay: 'always' });
  const pct = value =&gt; Math.abs(value) &lt; 0.05 ? '0,0%' : `${pf.format(value)}%`;
  const make = (name, attrs = {}, text = '') =&gt; {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
    if (text) node.textContent = text;
    return node;
  };
  const linePath = (series, x, y) =&gt; series.map((d, i) =&gt; `${i ? 'L' : 'M'}${x(d.year).toFixed(2)},${y(d.value).toFixed(2)}`).join(' ');

  function updateDetail(d) {
    const nYoy = d.nYoy === null ? 'tahun dasar' : `${pct(d.nYoy)} setahun`;
    const gYoy = d.gYoy === null ? 'tahun dasar' : `${pct(d.gYoy)} setahun`;
    detail.textContent = `${d.year} — Sarjana ${pct(d.g)} sejak 2016 (${gYoy}); nasional ${pct(d.n)} (${nYoy}); selisih pertumbuhan ${pct(d.g - d.n).replace('%', ' poin')}.`;
  }

  function render() {
    const width = Math.max(320, Math.round(root.clientWidth || 736));
    const height = width &lt; 480 ? 430 : 410;
    const margin = { top: 28, right: width &lt; 480 ? 18 : 26, bottom: 48, left: width &lt; 480 ? 48 : 58 };
    const plotW = width - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const x = year =&gt; margin.left + (year - 2016) / 10 * plotW;
    const y = value =&gt; margin.top + (60 - value) / 80 * plotH;
    const narrow = width &lt; 520;

    svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.appendChild(make('title', { id: 'growth-gap-title' }, 'Laju pertumbuhan pengangguran sarjana dibanding pengangguran nasional'));
    svg.appendChild(make('desc', { id: 'growth-gap-desc' }, 'Grafik garis perubahan kumulatif jumlah pengangguran sejak Februari 2016. Garis sarjana naik jauh lebih tinggi daripada garis nasional dan berakhir 45,5 poin persentase di atasnya pada 2026.'));
    svg.appendChild(make('rect', { x: 0, y: 0, width, height, class: 'plot-bg' }));

    [-20, 0, 20, 40, 60].forEach(tick =&gt; {
      const yy = y(tick);
      svg.appendChild(make('line', { x1: margin.left, y1: yy, x2: width - margin.right, y2: yy, class: tick === 0 ? 'zero-line' : 'grid' }));
      svg.appendChild(make('text', { x: margin.left - 9, y: yy + 4, 'text-anchor': 'end', class: 'tick text-small' }, `${tick &gt; 0 ? '+' : ''}${tick}%`));
    });
    data.forEach((d, i) =&gt; {
      if (!narrow || i % 2 === 0 || d.year === 2026) {
        svg.appendChild(make('text', { x: x(d.year), y: height - 18, 'text-anchor': 'middle', class: 'tick text-small' }, String(d.year)));
      }
    });
    svg.appendChild(make('text', { x: margin.left, y: 14, class: 'axis-label text-small' }, 'Pertumbuhan kumulatif jumlah pengangguran'));

    const gradSeries = data.map(d =&gt; ({ year: d.year, value: d.g }));
    const natSeries = data.map(d =&gt; ({ year: d.year, value: d.n }));
    const area = `${linePath(gradSeries, x, y)} ${natSeries.slice().reverse().map(d =&gt; `L${x(d.year).toFixed(2)},${y(d.value).toFixed(2)}`).join(' ')} Z`;
    svg.appendChild(make('path', { d: area, class: 'gap-area' }));
    svg.appendChild(make('path', { d: linePath(natSeries, x, y), class: 'growth-line national-line' }));
    svg.appendChild(make('path', { d: linePath(gradSeries, x, y), class: 'growth-line graduate-line' }));

    const dots = [];
    data.forEach(d =&gt; {
      const nDot = make('circle', { cx: x(d.year), cy: y(d.n), r: 3.5, class: 'national-dot' });
      const gDot = make('circle', { cx: x(d.year), cy: y(d.g), r: 3.5, class: 'graduate-dot' });
      svg.appendChild(nDot);
      svg.appendChild(gDot);
      dots.push({ nDot, gDot });
    });

    const last = data[data.length - 1];
    const labelX = x(2026) - 7;
    svg.appendChild(make('text', { x: labelX, y: y(last.g) - 12, 'text-anchor': 'end', class: 'direct-label text-small' }, `Sarjana ${pct(last.g)}`));
    svg.appendChild(make('text', { x: labelX, y: y(last.n) + 19, 'text-anchor': 'end', class: 'direct-label text-small' }, `Nasional ${pct(last.n)}`));

    const bracketX = x(2026) - (narrow ? 22 : 30);
    const topY = y(last.g) + 7;
    const bottomY = y(last.n) - 7;
    svg.appendChild(make('line', { x1: bracketX, y1: topY, x2: bracketX, y2: bottomY, class: 'gap-bracket' }));
    svg.appendChild(make('line', { x1: bracketX - 5, y1: topY, x2: bracketX + 5, y2: topY, class: 'gap-bracket' }));
    svg.appendChild(make('line', { x1: bracketX - 5, y1: bottomY, x2: bracketX + 5, y2: bottomY, class: 'gap-bracket' }));
    svg.appendChild(make('text', { x: bracketX - 9, y: (topY + bottomY) / 2 - 3, 'text-anchor': 'end', class: 'gap-label text-small' }, 'Jarak'));
    svg.appendChild(make('text', { x: bracketX - 9, y: (topY + bottomY) / 2 + 12, 'text-anchor': 'end', class: 'gap-label text-small' }, '+45,5 poin'));

    const guide = make('line', { x1: x(2026), y1: margin.top, x2: x(2026), y2: margin.top + plotH, class: 'guide' });
    svg.appendChild(guide);
    data.forEach((d, i) =&gt; {
      const left = i ? (x(data[i - 1].year) + x(d.year)) / 2 : margin.left;
      const right = i &lt; data.length - 1 ? (x(d.year) + x(data[i + 1].year)) / 2 : width - margin.right;
      const link = make('a', { href: '#growth-year-detail', 'aria-label': `${d.year}: sarjana ${pct(d.g)}, nasional ${pct(d.n)}` });
      link.appendChild(make('rect', { x: left, y: margin.top, width: Math.max(1, right - left), height: plotH, class: 'hit' }));
      const show = () =&gt; {
        guide.setAttribute('x1', x(d.year));
        guide.setAttribute('x2', x(d.year));
        guide.style.opacity = '1';
        dots[i].nDot.setAttribute('r', '5');
        dots[i].gDot.setAttribute('r', '5');
        updateDetail(d);
        tooltip.innerHTML = `&lt;strong&gt;${d.year}&lt;/strong&gt;&lt;br&gt;Sarjana: ${pct(d.g)} · ${nf.format(d.graduate)} orang&lt;br&gt;Nasional: ${pct(d.n)} · ${nf.format(d.national)} orang`;
        tooltip.classList.add('is-visible');
        const rect = svg.getBoundingClientRect();
        tooltip.style.left = `${Math.max(90, Math.min(rect.width - 90, x(d.year) / width * rect.width))}px`;
        tooltip.style.top = `${Math.max(76, Math.min(y(d.g), y(d.n)) / height * rect.height)}px`;
      };
      const hide = () =&gt; {
        guide.style.opacity = '0';
        dots[i].nDot.setAttribute('r', '3.5');
        dots[i].gDot.setAttribute('r', '3.5');
        tooltip.classList.remove('is-visible');
      };
      link.addEventListener('mouseenter', show);
      link.addEventListener('mouseleave', hide);
      link.addEventListener('focus', show);
      link.addEventListener('blur', hide);
      svg.appendChild(link);
    });
    updateDetail(last);
  }

  tableWrap.innerHTML = `&lt;table&gt;&lt;caption&gt;Pertumbuhan pengangguran dibanding Februari 2016&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Tahun&lt;/th&gt;&lt;th&gt;Sarjana&lt;/th&gt;&lt;th&gt;Nasional&lt;/th&gt;&lt;th&gt;Pertumbuhan sarjana&lt;/th&gt;&lt;th&gt;Pertumbuhan nasional&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${data.map(d =&gt; `&lt;tr&gt;&lt;td&gt;${d.year}&lt;/td&gt;&lt;td&gt;${nf.format(d.graduate)}&lt;/td&gt;&lt;td&gt;${nf.format(d.national)}&lt;/td&gt;&lt;td&gt;${pct(d.g)}&lt;/td&gt;&lt;td&gt;${pct(d.n)}&lt;/td&gt;&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;`;
  render();
  new ResizeObserver(render).observe(root);
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
